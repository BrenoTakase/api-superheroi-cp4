spring.application.name=hero-api
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Database - SQL Server (ambiente de desenvolvimento)
# Os valores após ":" são usados quando a variável de ambiente não é informada.
# Quando a API está em um container e o SQL Server está no host,
# use host.docker.internal como DB_SERVER_URL.
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA:herois_db};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PWD:1q2w3e4R@}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
